[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "wordpress-maintenance-agent"
version = "0.2.0"
description = "Read-only, evidence-backed WordPress maintenance audits"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Yousef Abdallah" }]
dependencies = ["httpx>=0.27,<1", "httpcore>=1.0,<2", "pydantic>=2.8,<3", "PyYAML>=6,<7", "defusedxml>=0.7,<1", "packaging>=24,<27", "tzdata>=2025.2,<2027", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "build>=1.2,<2"]

[project.scripts]
wp-maintenance = "wp_maintenance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wp_maintenance"]
include = ["src/wp_maintenance/**/*.py", "src/wp_maintenance/resources/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_tls: opens loopback TLS sockets (never the internet)"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
