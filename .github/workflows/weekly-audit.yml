name: Weekly WordPress maintenance audit

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-maintenance-weekly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
      - name: Load private configuration
        id: config
        env:
          CONFIG_B64: ${{ secrets.WP_MAINTENANCE_CONFIG_B64 }}
        run: |
          if [ -n "$CONFIG_B64" ]; then
            python -c 'import base64,os,pathlib; pathlib.Path("wp-maintenance.yaml").write_bytes(base64.b64decode(os.environ["CONFIG_B64"]))'
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -f wp-maintenance.yaml ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No site configuration found. Set WP_MAINTENANCE_CONFIG_B64 to enable scheduled audits."
          fi
      - name: Run audits
        if: steps.config.outputs.configured == 'true'
        env:
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}
          WORDPRESS_PRODUCTION: ${{ secrets.WORDPRESS_PRODUCTION }}
          WORDPRESS_STAGING: ${{ secrets.WORDPRESS_STAGING }}
        run: wp-maintenance audit --all --config wp-maintenance.yaml
      - uses: actions/upload-artifact@v7
        if: always() && steps.config.outputs.configured == 'true'
        with:
          name: wordpress-maintenance-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
