name: WordPress Maintenance Audit
run-name: "WordPress Maintenance Audit (${{ github.event_name }}${{ inputs.audit_scope && format(' - {0}', inputs.audit_scope) || '' }})"

# Weekly (Sunday 03:00 Africa/Cairo) and on-demand, read-only audits of the sites in config/websites.yaml
# (or the WP_MAINTENANCE_URLS repository variable). See docs/GITHUB_ACTIONS.md.
on:
  schedule:
    # GitHub supports IANA time zones for schedules, so Egypt's daylight saving time is handled for us.
    # Scheduled runs may start several minutes late. The schedule only runs when the repository variable
    # WP_MAINTENANCE_SCHEDULE_ENABLED is set to "true" (see the job condition below).
    - cron: "0 3 * * 0"
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      audit_scope:
        description: "What to audit: all enabled sites, a single inventory site, or one temporary URL"
        type: choice
        default: all
        options: [all, single, custom_url]
      site_id:
        description: "Inventory site id (audit_scope = single)"
        type: string
        required: false
      custom_url:
        description: "One-time URL, not saved to the inventory (audit_scope = custom_url)"
        type: string
        required: false
      max_urls:
        description: "Optional limit on sitemap URLs checked per site (1-50000)"
        type: string
        required: false
      report_mode:
        description: "standard or detailed (detailed lists every checked URL)"
        type: choice
        default: standard
        options: [standard, detailed]

# No default token permissions; the job requests exactly what it needs.
permissions: {}

concurrency:
  group: wordpress-maintenance-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit websites
    if: github.event_name != 'schedule' || vars.WP_MAINTENANCE_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read   # checkout
      actions: read    # download the previous history artifact (artifact history backend)
      issues: write    # only used when WP_MAINTENANCE_ISSUES=true
    env:
      # User-controlled workflow inputs are passed ONLY through environment variables and are never
      # interpolated into shell source. wp-maintenance validates every value again.
      INPUT_SCOPE: ${{ inputs.audit_scope || 'all' }}
      INPUT_SITE_ID: ${{ inputs.site_id }}
      INPUT_CUSTOM_URL: ${{ inputs.custom_url }}
      INPUT_MAX_URLS: ${{ inputs.max_urls }}
      INPUT_REPORT_MODE: ${{ inputs.report_mode || 'standard' }}
      WP_MAINTENANCE_URLS: ${{ vars.WP_MAINTENANCE_URLS }}
      RETENTION_DAYS: ${{ vars.WP_MAINTENANCE_RETENTION_DAYS || '365' }}
      FAIL_ON: ${{ vars.WP_MAINTENANCE_FAIL_ON || 'critical,incomplete' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install wp-maintenance
        run: python -m pip install .

      - name: Validate inventory and resolve targets
        run: |
          set -euo pipefail
          if [ -f config/websites.yaml ]; then
            wp-maintenance site validate --inventory config/websites.yaml
          fi
          # The dry run applies exactly the same selection, precedence and input validation as the real run.
          args=(--scope "$INPUT_SCOPE" --report-mode "$INPUT_REPORT_MODE" --dry-run)
          if [ -n "$INPUT_SITE_ID" ]; then args+=(--site "$INPUT_SITE_ID"); fi
          if [ -n "$INPUT_CUSTOM_URL" ]; then args+=(--url "$INPUT_CUSTOM_URL"); fi
          if [ -n "$INPUT_MAX_URLS" ]; then args+=(--max-urls "$INPUT_MAX_URLS"); fi
          wp-maintenance audit-batch "${args[@]}"

      - name: Decide report storage policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_REPO: ${{ vars.WP_MAINTENANCE_HISTORY_REPO }}
          HISTORY_KEY_SET: ${{ secrets.WP_MAINTENANCE_HISTORY_DEPLOY_KEY != '' }}
          PUBLIC_ARTIFACTS: ${{ vars.WP_MAINTENANCE_PUBLIC_ARTIFACTS }}
        run: bash scripts/ci/policy.sh

      - name: Load audit history (private repository)
        if: steps.policy.outputs.history_backend == 'repo'
        env:
          HISTORY_REPO: ${{ vars.WP_MAINTENANCE_HISTORY_REPO }}
          HISTORY_KEY: ${{ secrets.WP_MAINTENANCE_HISTORY_DEPLOY_KEY }}
        run: bash scripts/ci/history-repo-load.sh

      - name: Load audit history (previous artifact)
        if: steps.policy.outputs.history_backend == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/history-artifact-load.sh

      - name: Run audits
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_ISSUES: ${{ vars.WP_MAINTENANCE_ISSUES }}
          ISSUES_ALLOW_PUBLIC: ${{ vars.WP_MAINTENANCE_ISSUES_ALLOW_PUBLIC }}
          HISTORY_DIR: ${{ steps.policy.outputs.history_dir }}
        run: bash scripts/ci/run-audit.sh

      - name: Save audit history (private repository)
        if: always() && steps.policy.outputs.history_backend == 'repo' && steps.audit.outcome != 'skipped'
        env:
          HISTORY_REPO: ${{ vars.WP_MAINTENANCE_HISTORY_REPO }}
          HISTORY_KEY: ${{ secrets.WP_MAINTENANCE_HISTORY_DEPLOY_KEY }}
          REPORT_DIR: ${{ steps.audit.outputs.report_dir }}
        run: bash scripts/ci/history-repo-save.sh

      - name: Upload reports
        if: always() && steps.policy.outputs.upload_artifacts == 'true' && steps.audit.outputs.report_dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-maintenance-reports-${{ github.run_id }}
          path: ${{ steps.audit.outputs.report_dir }}
          retention-days: ${{ vars.WP_MAINTENANCE_ARTIFACT_RETENTION_DAYS || 30 }}
          if-no-files-found: warn

      - name: Upload history state (artifact backend)
        if: always() && steps.policy.outputs.history_backend == 'artifact' && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-maintenance-history
          path: history-state
          retention-days: ${{ vars.WP_MAINTENANCE_HISTORY_RETENTION_DAYS || 90 }}
          overwrite: true
          if-no-files-found: ignore

      - name: Enforce audit result
        if: always() && steps.audit.outputs.exit_code != '' && steps.audit.outputs.exit_code != '0'
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          echo "::error title=Maintenance audit needs attention::wp-maintenance exited with code ${AUDIT_EXIT_CODE} (policy: fail on ${FAIL_ON}). See the job summary."
          exit 1
